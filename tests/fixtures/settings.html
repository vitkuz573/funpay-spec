<!DOCTYPE html>
<html>
<head><title>FunPay - Settings</title></head>
<body>
<div class="settings-page">
  <div class="settings-section">
    <span class="settings-email">user@example.com</span>
    <span class="settings-phone">+7 (999) 123-45-67</span>
  </div>
  <div class="settings-section">
    <input class="settings-notify-email" type="checkbox" checked>
    <input class="settings-notify-push" type="checkbox">
  </div>
  <div class="settings-section">
    <select class="settings-language">
      <option value="ru" selected>Русский</option>
      <option value="en">English</option>
    </select>
    <select class="settings-timezone">
      <option value="Europe/Moscow" selected>Europe/Moscow</option>
      <option value="UTC">UTC</option>
    </select>
  </div>
</div>
</body>
</html>
