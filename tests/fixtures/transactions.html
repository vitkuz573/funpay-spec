<!DOCTYPE html>
<html>
<head><title>FunPay - Transactions</title></head>
<body>
<div class="transaction-list">
  <div class="transaction-item" data-transaction-id="TXN-001" data-type="purchase">
    <span class="transaction-amount">-1 234.56 <span class="currency">₽</span></span>
    <span class="transaction-date">25 июля 2024</span>
    <span class="transaction-desc">Покупка скина Dota 2</span>
    <span class="transaction-balance">5 765.44 <span class="currency">₽</span></span>
    <span class="transaction-order-link" data-order-id="ORD-001"></span>
  </div>
  <div class="transaction-item" data-transaction-id="TXN-002" data-type="sale">
    <span class="transaction-amount">+500.00 <span class="currency">₽</span></span>
    <span class="transaction-date">24 июля 2024</span>
    <span class="transaction-desc">Продажа скина CS2</span>
    <span class="transaction-balance">7 000.00 <span class="currency">₽</span></span>
    <span class="transaction-order-link" data-order-id="ORD-002"></span>
  </div>
  <div class="transaction-item" data-transaction-id="TXN-003" data-type="deposit">
    <span class="transaction-amount">+10 000.00 <span class="currency">₽</span></span>
    <span class="transaction-date">20 июля 2024</span>
    <span class="transaction-desc">Пополнение баланса</span>
    <span class="transaction-balance">6 500.00 <span class="currency">₽</span></span>
    <span class="transaction-order-link" data-order-id="ORD-003"></span>
  </div>
</div>
</body>
</html>
