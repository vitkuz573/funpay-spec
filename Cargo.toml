[package]
name = "funpay-spec"
version = "2.0.0"
edition = "2021"
description = "Enterprise-grade webspec specification for FunPay.com"
license = "MIT"
repository = "https://github.com/vitkuz573/funpay-spec"
authors = ["Vitaly Kuzyaev <vitkuz573@gmail.com>"]
keywords = ["funpay", "webspec", "scraping", "marketplace", "game-items"]
categories = ["web-programming", "parser-implementations"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["rustls-tls"] }
scraper = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
