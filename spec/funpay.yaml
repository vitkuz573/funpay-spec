        type: "UserId"
        selector: ".seller-info"
        attribute: "data-user-id"
        description: "Seller's user ID"
      name:
        type: "String"
        selector: ".seller-name"
        description: "Seller display name"
      rating:
        type: "f64"
        selector: ".seller-rating"
        description: "Seller rating score"
      reviews_count:
        type: "u32"
        selector: ".seller-reviews"
        description: "Number of reviews"
      avatar_url:
        type: "Url"
        selector: ".seller-avatar img"
        attribute: "src"
        description: "Avatar image URL"
      online:
        type: "OnlineStatus"
        selector: ".seller-online"
        description: "Online status"
      response_time:
        type: "Option<String>"
        selector: ".seller-response-time"
        nullable: true
        description: "Average response time"

  Lot:
    fields:
      id:
        type: "LotId"
        selector: ".tc-item"
        attribute: "data-lot-id"
        description: "Unique lot identifier"
      game:
        type: "Option<String>"
        selector: ".tc-game"
        description: "Game name"
      server:
        type: "Option<String>"
        selector: ".tc-server"
        description: "Game server"
      seller:
        type: "Seller"
        selector: ".tc-seller"
        description: "Seller information"
      price:
        type: "Price"
        selector: ".tc-price"
        transform: "parse_price"
        description: "Lot price"
      currency:
        type: "Currency"
        selector: ".tc-price .currency"
        description: "Price currency"
      description:
