transforms:
  parse_price:
    input: "String"
    output: "Price"
    description: "Extract numeric price from text like '1 234.56 ₽'"
    examples:
      - input: "1 234.56 ₽"
        output: "1234.56"
      - input: "$12.99"
        output: "12.99"
      - input: "0.50"
        output: "0.50"
  parse_date:
    input: "String"
    output: "Timestamp"
    description: "Parse Russian date format to ISO 8601"
    examples:
      - input: "25 июля 2024"
        output: "2024-07-25T00:00:00Z"
      - input: "вчера, 14:30"
        output: "2024-07-24T14:30:00Z"
  parse_id_from_url:
    input: "String"
    output: "u64"
    description: "Extract numeric ID from URL path like '/lots/12345/'"
    examples:
      - input: "/lots/12345/"
        output: "12345"
      - input: "/users/99999/"
        output: "99999"
  parse_online_status:
    input: "String"
    output: "OnlineStatus"
    description: "Map CSS class to online status"
    map:
      online: "online"
      offline: "offline"
  parse_balance:
    input: "String"
    output: "Balance"
    description: "Extract balance amount from text"
    examples:
      - input: "1 234.56 ₽"
        output: "1234.56"

enums:
  LotSaleType:
    values:
      single: "single"
      bulk: "bulk"
  OfferOrderType:
    values:
