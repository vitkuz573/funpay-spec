version: "1.0"
name: "FunPay"
protocol: "webspec"
base_url: "https://funpay.com"

types:
  OfferId:
    rust: "u64"
    typescript: "number"
    python: "int"
    go: "uint64"
    java: "long"
    newtype: true
  UserId:
    rust: "u64"
    typescript: "number"
    python: "int"
    go: "uint64"
    java: "long"
    newtype: true
  LotId:
    rust: "u64"
    typescript: "number"
    python: "int"
    go: "uint64"
    java: "long"
    newtype: true
  GameId:
    rust: "u64"
    typescript: "number"
    python: "int"
    go: "uint64"
    java: "long"
    newtype: true
  Price:
    rust: "f64"
    typescript: "number"
    python: "float"
    go: "float64"
    java: "double"
    newtype: true
  Currency:
    rust: "String"
    typescript: "string"
    python: "str"
    go: "string"
    java: "String"
  Url:
    rust: "String"
    typescript: "string"
    python: "str"
    go: "string"
    java: "String"
  HtmlContent:
    rust: "String"
    typescript: "string"
    python: "str"
    go: "string"
    java: "String"
  Timestamp:
    rust: "String"
    typescript: "string"
    python: "str"
    go: "string"
    java: "String"

enums:
  LotSaleType:
    values:
      single: "single"
      bulk: "bulk"
  OfferOrderType:
    values:
      auto: "auto"
      manual: "manual"
  ServerTagType:
    values:
      server: "server"
      platform: "platform"
  OrderStatus:
    values:
      pending: "pending"
      active: "active"
      completed: "completed"
      cancelled: "cancelled"
      disputed: "disputed"
  OnlineStatus:
    values:
      online: "online"
      offline: "offline"

entities:
  Game:
    fields:
      id:
        type: "String"
        selector: "a.game-title"
        attribute: "data-game-id"
      title:
        type: "String"
        selector: "a.game-title"
      icon_url:
        type: "Url"
        selector: "img.game-icon"
        attribute: "src"
      url:
        type: "Url"
        selector: "a.game-title"
        attribute: "href"
      categories:
        type: "Vec<Category>"
        selector: ".game-categories"

  Category:
    fields:
      id:
        type: "String"
        selector: ".category-item"
        attribute: "data-category-id"
      title:
        type: "String"
        selector: ".category-item .cat-title"
      url:
        type: "Url"
        selector: ".category-item a"
        attribute: "href"
      game_id:
        type: "String"
        nullable: true

  Offer:
    fields:
      id:
        type: "OfferId"
        selector: ".tc-item"
        attribute: "data-order"
      seller_id:
        type: "UserId"
        selector: ".tc-item"
        attribute: "data-user-id"
      server:
        type: "Option<String>"
        selector: ".tc-server"
      price:
        type: "Price"
        selector: ".tc-price"
        transform: "parse_price"
      currency:
        type: "Currency"
        selector: ".tc-price .currency"
      description:
        type: "Option<String>"
        selector: ".tc-desc-text"
      sale_type:
        type: "LotSaleType"
        selector: ".tc-item"
        attribute: "data-mark"
      item_count:
        type: "Option<u32>"
        selector: ".tc-item"
        attribute: "data lot-size"
        nullable: true

  OfferLot:
    fields:
      offer_id:
        type: "OfferId"
        selector: ".tc-item"
        attribute: "data-order"
      server:
        type: "Option<String>"
        selector: ".tc-server"
      price:
        type: "Price"
        selector: ".tc-price"
        transform: "parse_price"
      description:
        type: "Option<String>"
        selector: ".tc-desc-text"

  User:
    fields:
      id:
        type: "UserId"
        selector: ".profile-user-id"
        attribute: "data-user-id"
      username:
        type: "String"
        selector: ".profile-title"
      avatar_url:
        type: "Url"
        selector: ".profile-avatar img"
        attribute: "src"
      status:
        type: "Option<String>"
        selector: ".user-status"
      registration_date:
        type: "Option<Timestamp>"
        selector: ".profile-regdate"
        transform: "parse_date"

  LotItem:
    fields:
      id:
        type: "String"
        selector: ".tc-item"
        attribute: "data-item-id"
      name:
        type: "String"
        selector: ".tc-item-text"
      image_url:
        type: "Option<Url>"
        selector: ".tc-item img"
        attribute: "src"

  Seller:
    fields:
      user_id:
        type: "UserId"
        selector: ".seller-info"
        attribute: "data-user-id"
      name:
        type: "String"
        selector: ".seller-info .seller-name"
      rating:
        type: "f64"
        selector: ".seller-rating"
      reviews:
        type: "u32"
        selector: ".seller-reviews"
      avatar_url:
        type: "Url"
        selector: ".seller-avatar img"
        attribute: "src"
      online:
        type: "OnlineStatus"
        selector: ".seller-online"

  Lot:
    fields:
      id:
        type: "String"
        selector: ".tc-item"
        attribute: "data-lot-id"
      game:
        type: "Option<String>"
        selector: ".tc-game"
      server:
        type: "Option<String>"
        selector: ".tc-server"
      seller:
        type: "Seller"
        selector: ".tc-seller"
      price:
        type: "Price"
        selector: ".tc-price"
        transform: "parse_price"
      currency:
        type: "Currency"
        selector: ".tc-price .currency"
      description:
        type: "Option<String>"
        selector: ".tc-desc-text"

  Order:
    fields:
      order_id:
        type: "String"
        selector: ".order-item"
        attribute: "data-order-id"
      game:
        type: "Option<String>"
        selector: ".order-game"
      status:
        type: "OrderStatus"
        selector: ".order-status"
      price:
        type: "Price"
        selector: ".order-price"
        transform: "parse_price"
      currency:
        type: "Currency"
        selector: ".order-price .currency"
      date:
        type: "Option<Timestamp>"
        selector: ".order-date"
        transform: "parse_date"
      seller:
        type: "Seller"
        selector: ".order-seller"
      buyer:
        type: "Seller"
        selector: ".order-buyer"

  Chat:
    fields:
      chat_id:
        type: "String"
        selector: ".chat-item"
        attribute: "data-chat-id"
      user:
        type: "Seller"
        selector: ".chat-item"
      last_message:
        type: "Option<String>"
        selector: ".chat-last-message"
      unread_count:
        type: "u32"
        selector: ".chat-unread"

  ChatMessage:
    fields:
      message_id:
        type: "String"
        selector: ".msg"
        attribute: "data-msg-id"
      sender:
        type: "UserId"
        selector: ".msg"
        attribute: "data-sender-id"
      text:
        type: "String"
        selector: ".msg-text"
      date:
        type: "Option<Timestamp>"
        selector: ".msg-date"
        transform: "parse_date"
      is_self:
        type: "bool"
        selector: ".msg"
        attribute: "data-self"

  Review:
    fields:
      review_id:
        type: "String"
        selector: ".review-item"
        attribute: "data-review-id"
      author:
        type: "Seller"
        selector: ".review-author"
      text:
        type: "Option<String>"
        selector: ".review-text"
      date:
        type: "Option<Timestamp>"
        selector: ".review-date"
        transform: "parse_date"
      rating:
        type: "f64"
        selector: ".review-rating"
      order_link:
        type: "Option<String>"
        selector: ".review-order-link"
        attribute: "href"

  GameCategory:
    fields:
      id:
        type: "String"
        selector: ".category-item"
        attribute: "data-category-id"
      name:
        type: "String"
        selector: ".category-item .cat-title"
      url:
        type: "Url"
        selector: ".category-item a"
        attribute: "href"

pages:
  game_list:
    url: "/lots/"
    list_selector: ".game-list .game-title"
    entity: "Game"
    description: "Main games catalog page"

  category_offers:
    url_pattern: "/lots/{game_id}/{category_id}/"
    list_selector: ".tc-item"
    entity: "Offer"
    description: "Offers in a specific game category"

  user_profile:
    url_pattern: "/users/{user_id}/"
    entity: "User"
    description: "User profile page"

  user_offers:
    url_pattern: "/users/{user_id}/lots/"
    list_selector: ".tc-item"
    entity: "OfferLot"
    description: "User's active offers"

  seller_profile:
    url_pattern: "/users/{seller_id}/"
    entity: "Seller"
    description: "Seller profile page"

  orders:
    url: "/orders/"
    list_selector: ".order-item"
    entity: "Order"
    description: "User's orders page"

  chats:
    url: "/chats/"
    list_selector: ".chat-item"
    entity: "Chat"
    description: "User's chat list"

  chat_messages:
    url_pattern: "/chats/{chat_id}/"
    list_selector: ".msg"
    entity: "ChatMessage"
    description: "Messages in a chat conversation"

drift_detection:
  enabled: true
  interval: "24h"
  critical_selectors:
    - selector: ".tc-item"
      context: "offer_list"
      description: "Offer cards on category page"
    - selector: ".tc-price"
      context: "offer_price"
      description: "Price element in offer cards"
    - selector: ".tc-server"
      context: "offer_server"
      description: "Server name in offer cards"
    - selector: ".tc-desc-text"
      context: "offer_description"
      description: "Description text in offer cards"
    - selector: ".profile-title"
      context: "user_profile"
      description: "Username on profile page"
    - selector: ".game-title"
      context: "game_list"
      description: "Game titles in catalog"
    - selector: ".category-item"
      context: "category_list"
      description: "Category items in game page"
    - selector: ".tc-item"
      context: "user_lots"
      description: "User's lot items"
  test_urls:
    - url: "/lots/"
      description: "Main lots page"
    - url: "/users/1/"
      description: "Test user profile"

auth:
  type: "cookie"
  cookie_name: "golden_key"
  required_for:
    - "send_message"
    - "create_offer"
    - "edit_offer"
    - "delete_offer"
    - "get_balance"

rate_limits:
  requests_per_second: 2.0
  max_retries: 3
