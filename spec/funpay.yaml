      rating: "rating"
      date: "date"

entities:
  Game:
    fields:
      id:
        type: "GameId"
        selector: ".game-title"
        attribute: "data-game-id"
        description: "Unique game identifier"
      title:
        type: "String"
        selector: ".game-title"
        description: "Display name of the game"
      icon_url:
        type: "Option<Url>"
        selector: ".game-icon"
        attribute: "src"
        description: "Game icon image URL"
      url:
        type: "Url"
        selector: ".game-title"
        attribute: "href"
        description: "Relative URL to game page"

  Category:
    fields:
      id:
        type: "CategoryId"
        selector: ".category-item"
        attribute: "data-category-id"
        description: "Unique category identifier"
      title:
        type: "String"
        selector: ".cat-title"
        description: "Category display name"
      url:
        type: "Url"
        selector: ".category-item a"
        attribute: "href"
        description: "Relative URL to category offers"
      game_id:
        type: "Option<GameId>"
        description: "Parent game ID (set when nested)"
      offers_count:
        type: "Option<u32>"
        selector: ".cat-count"
        description: "Number of offers in category"
        nullable: true

  SubCategory:
    fields:
      id:
        type: "CategoryId"
        selector: ".subcategory-item"
        attribute: "data-category-id"
        description: "Subcategory identifier"
      name:
        type: "String"
        selector: ".subcategory-item .cat-title"
        description: "Subcategory display name"
      url:
        type: "Url"
        selector: ".subcategory-item a"
        attribute: "href"
        description: "Relative URL"
      parent_id:
        type: "CategoryId"
        selector: ".subcategory-item"
        attribute: "data-parent-id"
        description: "Parent category ID"

  GameServer:
    fields:
      id:
        type: "ServerId"
        selector: ".server-item"
        attribute: "data-server-id"
        description: "Unique server identifier"
      name:
        type: "String"
        selector: ".server-item .server-name"
        description: "Server display name"
      game_id:
        type: "GameId"
        selector: ".server-item"
        attribute: "data-game-id"
        description: "Associated game"
      platform:
        type: "Option<String>"
        selector: ".server-item .server-platform"
        description: "Platform (PC, Mobile, etc.)"
        nullable: true
      offers_count:
        type: "u32"
        selector: ".server-item .server-count"
        description: "Number of offers on this server"

  Offer:
    fields:
      id:
        type: "OfferId"
        selector: ".tc-item"
        attribute: "data-order"
        description: "Unique offer identifier"
      seller_id:
        type: "UserId"
        selector: ".tc-item"
        attribute: "data-user-id"
        description: "Seller's user ID"
      server:
        type: "Option<String>"
        selector: ".tc-server"
        description: "Game server name"
      price:
        type: "Price"
        selector: ".tc-price"
        transform: "parse_price"
        description: "Offer price"
      currency:
        type: "Currency"
        selector: ".tc-price .currency"
        description: "Price currency symbol"
      description:
        type: "Option<String>"
        selector: ".tc-desc-text"
        description: "Seller's description"
      sale_type:
        type: "LotSaleType"
        selector: ".tc-item"
        attribute: "data-mark"
        description: "Single or bulk sale"
      item_count:
        type: "Option<u32>"
        selector: ".tc-item"
        attribute: "data-lot-size"
        nullable: true
        description: "Number of items in lot"
      image_url:
        type: "Option<Url>"
        selector: ".tc-item img"
        attribute: "src"
        nullable: true
        description: "Offer preview image"

  OfferLot:
    fields:
      offer_id:
        type: "OfferId"
        selector: ".tc-item"
        attribute: "data-order"
        description: "Parent offer ID"
      server:
        type: "Option<String>"
