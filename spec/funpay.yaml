  Order:
    fields:
      order_id:
        type: "String"
        selector: ".order-item"
        attribute: "data-order-id"
        description: "Unique order identifier"
      game:
        type: "Option<String>"
        selector: ".order-game"
        nullable: true
        description: "Game name"
      status:
        type: "OrderStatus"
        selector: ".order-status"
        description: "Current order status"
      price:
        type: "Price"
        selector: ".order-price"
        transform: "parse_price"
        description: "Order total price"
      currency:
        type: "Currency"
        selector: ".order-price .currency"
        description: "Price currency"
      date:
        type: "Option<Timestamp>"
        selector: ".order-date"
        transform: "parse_date"
        nullable: true
        description: "Order creation date"
      seller:
        type: "Seller"
        selector: ".order-seller"
        description: "Seller information"
      buyer:
        type: "Seller"
        selector: ".order-buyer"
        description: "Buyer information"

  Transaction:
    fields:
      id:
        type: "TransactionId"
        selector: ".transaction-item"
        attribute: "data-transaction-id"
        description: "Unique transaction identifier"
      type:
