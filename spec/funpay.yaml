      manual: "manual"
  ServerTagType:
    values:
      server: "server"
      platform: "platform"
  OrderStatus:
    values:
      pending: "pending"
      active: "active"
      completed: "completed"
      cancelled: "cancelled"
      disputed: "disputed"
  OnlineStatus:
    values:
      online: "online"
      offline: "offline"
  NotificationType:
    values:
