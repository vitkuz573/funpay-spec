      author:
        type: "Seller"
        selector: ".review-author"
        description: "Review author"
      text:
        type: "Option<String>"
        selector: ".review-text"
        nullable: true
        description: "Review text"
      date:
        type: "Option<Timestamp>"
        selector: ".review-date"
        transform: "parse_date"
        nullable: true
        description: "Review date"
      rating:
        type: "f64"
        selector: ".review-rating"
        description: "Rating given"
      order_link:
        type: "Option<String>"
        selector: ".review-order-link"
        attribute: "href"
        nullable: true
        description: "Link to related order"

  Notification:
    fields:
      id:
        type: "NotificationId"
        selector: ".notification-item"
        attribute: "data-notification-id"
        description: "Unique notification identifier"
      type:
        type: "NotificationType"
        selector: ".notification-item"
        attribute: "data-type"
        description: "Notification category"
      title:
        type: "String"
        selector: ".notification-title"
        description: "Notification title"
      text:
        type: "Option<String>"
        selector: ".notification-text"
        nullable: true
        description: "Notification body text"
      date:
        type: "Option<Timestamp>"
        selector: ".notification-date"
        transform: "parse_date"
        nullable: true
        description: "Notification timestamp"
      is_read:
        type: "bool"
        selector: ".notification-item"
        attribute: "data-read"
        description: "Whether notification is read"
      link:
        type: "Option<Url>"
        selector: ".notification-link"
        attribute: "href"
        nullable: true
        description: "Related page link"

  Search:
    fields:
      query:
        type: "String"
        selector: ".search-input"
        description: "Search query text"
      results_count:
        type: "u32"
        selector: ".search-results-count"
        description: "Total results count"
      offers:
        type: "Vec<Offer>"
        selector: ".tc-item"
        description: "Search result offers"
      sort:
        type: "SearchSort"
        selector: ".search-sort"
        description: "Current sort order"

  Settings:
    fields:
      email:
        type: "Option<Email>"
        selector: ".settings-email"
        nullable: true
        description: "Account email"
      phone:
        type: "Option<Phone>"
        selector: ".settings-phone"
        nullable: true
        description: "Account phone"
      notification_email:
        type: "bool"
        selector: ".settings-notify-email"
        description: "Email notifications enabled"
      notification_push:
        type: "bool"
        selector: ".settings-notify-push"
        description: "Push notifications enabled"
      language:
        type: "String"
        selector: ".settings-language"
        description: "Interface language"
      timezone:
        type: "String"
        selector: ".settings-timezone"
        description: "User timezone"

  GameCategory:
    fields:
      id:
        type: "CategoryId"
