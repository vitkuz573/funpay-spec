        attribute: "data-chat-id"
        description: "Unique chat identifier"
      chat_type:
        type: "ChatType"
        selector: ".chat-item"
        attribute: "data-chat-type"
        description: "Chat type"
      user:
        type: "Seller"
        selector: ".chat-user .seller-name"
        description: "Other participant"
      last_message:
        type: "Option<String>"
        selector: ".chat-last-message"
        nullable: true
