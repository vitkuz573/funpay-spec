        description: "Display username"
      avatar_url:
        type: "Option<Url>"
        selector: ".profile-avatar"
        attribute: "src"
        nullable: true
        description: "Avatar image URL"
      status:
        type: "Option<String>"
        selector: ".user-status"
        nullable: true
        description: "Custom status text"
      registration_date:
        type: "Option<Timestamp>"
        selector: ".profile-regdate"
        transform: "parse_date"
        nullable: true
        description: "Account creation date"
      online_status:
        type: "OnlineStatus"
        selector: ".profile-online"
        description: "Current online status"

  LotItem:
    fields:
      id:
        type: "LotId"
        selector: ".tc-item"
        attribute: "data-item-id"
        description: "Lot item identifier"
      name:
        type: "String"
        selector: ".tc-item-text"
        description: "Item display name"
      image_url:
        type: "Option<Url>"
        selector: ".tc-item img"
        attribute: "src"
        nullable: true
        description: "Item image URL"

  Seller:
