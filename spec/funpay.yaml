      name:
        type: "String"
        selector: ".cat-title"
        description: "Category name"
      url:
        type: "Url"
        selector: ".category-item a"
        attribute: "href"
        description: "Category URL"

pages:
  game_list:
    url: "/lots/"
    list_selector: ".game-title"
    entity: "Game"
    description: "Main games catalog page"

  category_offers:
    url_pattern: "/lots/{game_id}/{category_id}/"
    list_selector: ".tc-item"
    entity: "Offer"
    description: "Offers in a specific game category"

  user_profile:
    url_pattern: "/users/{user_id}/"
    entity: "User"
    description: "User profile page"

  user_offers:
    url_pattern: "/users/{user_id}/lots/"
    list_selector: ".tc-item"
    entity: "OfferLot"
    description: "User's active offers"

  seller_profile:
    url_pattern: "/users/{seller_id}/"
    entity: "Seller"
    description: "Seller profile page"

  orders:
    url: "/orders/"
    list_selector: ".order-item"
    entity: "Order"
    description: "User's orders page"

  chats:
    url: "/chats/"
    list_selector: ".chat-item"
    entity: "Chat"
    description: "User's chat list"

  chat_messages:
    url_pattern: "/chats/{chat_id}/"
    list_selector: ".msg"
    entity: "ChatMessage"
    description: "Messages in a chat conversation"

  search:
    url_pattern: "/search/?q={query}&sort={sort}"
    list_selector: ".tc-item"
    entity: "Search"
    description: "Search results page"

  notifications:
    url: "/notifications/"
    list_selector: ".notification-item"
    entity: "Notification"
    description: "User notifications page"

  settings:
    url: "/settings/"
    entity: "Settings"
    description: "User settings page"

  transactions:
    url: "/wallet/transactions/"
    list_selector: ".transaction-item"
    entity: "Transaction"
    description: "Transaction history page"

  reviews:
    url_pattern: "/users/{user_id}/reviews/"
    list_selector: ".review-item"
    entity: "Review"
    description: "User reviews page"

  game_servers:
    url_pattern: "/lots/{game_id}/servers/"
    list_selector: ".server-item"
    entity: "GameServer"
    description: "Game servers list"

  subcategories:
    url_pattern: "/lots/{game_id}/{category_id}/"
    list_selector: ".subcategory-item"
    entity: "SubCategory"
    description: "Subcategories within a category"

drift_detection:
  enabled: true
  interval: "24h"
  critical_selectors:
    - selector: ".tc-item"
      context: "offer_list"
      description: "Offer cards on category page"
    - selector: ".tc-price"
      context: "offer_price"
      description: "Price element in offer cards"
    - selector: ".tc-server"
      context: "offer_server"
      description: "Server name in offer cards"
    - selector: ".tc-desc-text"
      context: "offer_description"
      description: "Description text in offer cards"
    - selector: ".profile-title"
      context: "user_profile"
      description: "Username on profile page"
    - selector: ".game-title"
      context: "game_list"
      description: "Game titles in catalog"
    - selector: ".category-item"
      context: "category_list"
      description: "Category items in game page"
    - selector: ".tc-item"
      context: "user_lots"
      description: "User's lot items"
    - selector: ".chat-item"
      context: "chat_list"
      description: "Chat list items"
    - selector: ".msg"
      context: "chat_messages"
      description: "Chat message elements"
    - selector: ".order-item"
      context: "order_list"
      description: "Order list items"
    - selector: ".notification-item"
      context: "notification_list"
      description: "Notification items"
    - selector: ".seller-name"
      context: "seller_info"
      description: "Seller name display"
    - selector: ".seller-rating"
      context: "seller_info"
      description: "Seller rating display"
    - selector: ".search-input"
      context: "search"
      description: "Search input field"
    - selector: ".review-item"
      context: "review_list"
      description: "Review items"
    - selector: ".transaction-item"
      context: "transaction_list"
      description: "Transaction items"
  test_urls:
    - url: "/lots/"
      description: "Main lots page"
    - url: "/users/1/"
      description: "Test user profile"
    - url: "/chats/"
      description: "Chat list page"
    - url: "/orders/"
      description: "Orders page"
    - url: "/notifications/"
      description: "Notifications page"
    - url: "/search/?q=test"
      description: "Search results"

auth:
  type: "cookie"
  cookie_name: "golden_key"
  required_for:
    - "send_message"
    - "create_offer"
    - "edit_offer"
    - "delete_offer"
